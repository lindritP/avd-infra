name: Ansible CD

# ─────────────────────────────────────────────────────────────────────────────
# WANN: NUR manuell per Knopf (workflow_dispatch).
# Führt die Playbooks gegen die echten Hosts aus -> mit Environment-Gate.
#
# SICHERHEIT (öffentliches Repo + self-hosted Runner im VNet):
#  - KEIN push/PR-Trigger -> der self-hosted Runner startet nie automatisch.
#    Ein gemergter Change löst KEINEN Lauf auf der VNet-Box aus.
#  - Lauf nur durch bewussten Dispatch + Environment mit Required Reviewers.
#  - PR-CI (ansible-ci.yml) läuft auf ubuntu-latest, NIE auf self-hosted.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ziel-Environment"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: ansible-cd-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  configure:
    name: Configure Hosts
    runs-on: [self-hosted, vnet]    # laeuft auf der Ansible-Control-Node im VNet
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: ansible
    env:
      ENV_NAME: ${{ github.event.inputs.environment || 'dev' }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      # WinRM-Credentials als ENV-Variablen (NICHT auf der Kommandozeile via
      # --extra-vars -> kein Prozesslisten-Leak). Quelle: Key Vault, gesynct ins
      # Environment-Secret. group_vars liest sie via lookup('env',...).
      ANSIBLE_USER: ${{ secrets.ANSIBLE_USER }}
      ANSIBLE_PASSWORD: ${{ secrets.ANSIBLE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ansible installieren
        run: pip install --quiet ansible-core pywinrm

      # Dynamic Inventory (azure_rm) authentifiziert sich über die Managed
      # Identity der Runner-VM (auth_source: msi). Credentials kommen via
      # ANSIBLE_USER/ANSIBLE_PASSWORD (env) -> group_vars, NICHT auf der CLI.

      # Schritt 1 — DRY RUN: zeigt, was sich ändern WÜRDE (wie terraform plan).
      - name: Playbook (Check-Modus / Dry Run)
        run: |
          ansible-playbook playbooks/site.yml \
            -i "inventories/${ENV_NAME}/azure_rm.yml" \
            --check --diff

      # Schritt 2 — ECHTER LAUF: erst nach dem (ggf. genehmigten) Environment-Gate.
      - name: Playbook ausführen
        run: |
          ansible-playbook playbooks/site.yml \
            -i "inventories/${ENV_NAME}/azure_rm.yml"
