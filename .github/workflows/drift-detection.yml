name: Drift Detection

# ─────────────────────────────────────────────────────────────────────────────
# WANN: Werktags morgens automatisch + manuell.
# Erkennt, wenn die echte Azure-Welt vom Terraform-Code abweicht (z. B. jemand
# hat im Portal geklickt). Ändert NICHTS — nur Plan + Meldung.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "0 6 * * 1-5"   # Mo–Fr, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write             # um bei Drift ein Issue zu öffnen

env:
  TF_VERSION: "1.15.5"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  # Damit der Drift-Plan das github-runner-pat-Secret nicht als "fehlend" meldet.
  TF_VAR_github_runner_pat: ${{ secrets.GH_RUNNER_PAT }}

jobs:
  detect:
    name: Drift in ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]   # beide Umgebungen parallel prüfen
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        run: terraform init -input=false
        working-directory: terraform/environments/${{ matrix.environment }}

      # -detailed-exitcode: 0 = keine Änderung, 2 = Drift erkannt, 1 = Fehler
      - name: Drift-Plan
        id: drift
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -no-color
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        working-directory: terraform/environments/${{ matrix.environment }}

      - name: Issue bei Drift öffnen
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Infrastructure-Drift erkannt: ${{ matrix.environment }}`,
              labels: ['drift', 'infrastructure'],
              body: `Im Environment \`${{ matrix.environment }}\` weicht die echte Infrastruktur vom Terraform-Code ab.\n\n`
                  + `Vermutlich wurde manuell (z. B. im Azure-Portal) etwas geändert.\n\n`
                  + `**Nächster Schritt:** Den Plan im Workflow-Log ansehen und entscheiden:\n`
                  + `- Code an die Realität anpassen, **oder**\n`
                  + `- per \`apply\` die Realität auf den Code zurücksetzen.\n\n`
                  + `Lauf: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
